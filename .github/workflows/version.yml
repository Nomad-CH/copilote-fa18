# Fabrique l'application Windows et son installateur a chaque envoi sur main.
# Si la version (copilote/__init__.py) n'est pas encore publiee, la publie :
# l'application des utilisateurs la verra alors comme mise a jour.
name: Publier une version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Version
        shell: pwsh
        run: |
          $v = python -c "import copilote; print(copilote.__version__)"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY 2>$null
          $nouvelle = if ($LASTEXITCODE -eq 0) { "non" } else { "oui" }
          "NOUVELLE=$nouvelle" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Version $v, nouvelle : $nouvelle"
          $global:LASTEXITCODE = 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: hidapi (pilote du Stream Deck)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/libusb/hidapi/releases/download/hidapi-0.14.0/hidapi-win.zip -OutFile hidapi.zip
          Expand-Archive hidapi.zip -DestinationPath hidapi_zip
          Copy-Item hidapi_zip/x64/hidapi.dll .

      - name: Application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name CopiloteF18 --icon icone.ico `
            --add-data "polices;polices" `
            --add-data "tablette;tablette" `
            --add-data "dcsbios_json;dcsbios_json" `
            --add-data "outils/CopiloteExport.lua;outils" `
            --add-data "config_defaut.json;." `
            --add-data "icone.ico;." `
            --add-binary "hidapi.dll;." `
            --collect-all edge_tts --collect-data certifi --collect-submodules qrcode `
            --hidden-import StreamDeck.Transport.LibUSBHIDAPI `
            lanceur.py
          Copy-Item hidapi.dll dist/CopiloteF18/

      - name: Installateur
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Essai de demarrage de l'application
        shell: pwsh
        run: |
          $p = Start-Process dist/CopiloteF18/CopiloteF18.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Get-Content "$env:LOCALAPPDATA/CopiloteF18/journal.txt" -ErrorAction SilentlyContinue
            Write-Error "L'application s'est fermee toute seule au demarrage"
            exit 1
          }
          Stop-Process -Id $p.Id
          Get-Content "$env:LOCALAPPDATA/CopiloteF18/journal.txt" -ErrorAction SilentlyContinue

      - name: Publication
        if: env.NOUVELLE == 'oui'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Copilote F/A-18 ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: sortie/CopiloteF18-Setup.exe
          body_path: NOTES_VERSION.md
          make_latest: true

      - name: Installateur (version deja publiee)
        if: env.NOUVELLE != 'oui'
        uses: actions/upload-artifact@v4
        with:
          name: CopiloteF18-Setup
          path: sortie/CopiloteF18-Setup.exe
